<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181818">
  <title>Um convite especial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="envelope-page">
  <main class="envelope-screen" aria-label="Convite de aniversário">
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>

    <button class="seal-button" id="openInvitation" aria-label="Abrir convite">
      <img src="assets/envelope-1.jpeg" alt="Envelope dourado do convite">
      <span class="seal-hotspot" aria-hidden="true"></span>
    </button>

    <div class="opening-hint">
      <span class="hint-text">Clique no convite para abrir</span>
      <span class="hint-arrow">↘</span>
    </div>

    <div class="opening-shine" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
