<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Convite de Aniversário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="invitation-page">
  <main class="invitation-screen">
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>

    <section class="invitation-card" aria-label="Convite de aniversário">
      <img class="invitation-image" src="assets/convite-1.jpeg" alt="Convite de aniversário de 50 anos">

      <div class="decor decor-top-left" aria-hidden="true">✦</div>
      <div class="decor decor-top-right" aria-hidden="true">✧</div>
      <div class="decor decor-bottom-left" aria-hidden="true">✧</div>
      <div class="decor decor-bottom-right" aria-hidden="true">✦</div>

      <div class="interactive-buttons" aria-label="Ações do convite">
        <a class="action-button location-button" id="locationButton" href="#" target="_blank" rel="noopener noreferrer">
          <img class="action-icon" src="assets/localização.png" alt="Ícone de localização">
          <span class="span">Localização</span>
        </a>

        <a class="action-button confirm-button" id="confirmButton" href="#" target="_blank" rel="noopener noreferrer">
          <span class="action-icon">✓</span>
          <span class="span">Confirmar presença</span>
        </a>
      </div>

      <p class="mobile-tip">Toque nos ícones para interagir</p>
    </section>

    <a class="back-link" href="index.html">↩ Voltar ao envelope</a>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
